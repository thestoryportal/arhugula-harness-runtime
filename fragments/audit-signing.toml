#: title = Audit signing
#: summary = Every audit entry is signed with a local Ed25519 key, so `arhugula audit verify --signatures` can prove the ledger was written by this deployment.
#: needs = a signing key: arhugula audit keygen

[runtime.audit_signing]
backend = "local-ed25519"

[runtime.audit_signing.local_key_paths]
"harness-runtime-dev" = "{{KEYS}}/audit-ed25519.pem"
"harness-cost-attribution-v1" = "{{KEYS}}/audit-ed25519.pem"
