#: title = Audit signing
#: summary = Every audit entry is signed with a local Ed25519 key. A ledger that is signed from its first entry also gets a cutover record, and then verifies in full with `arhugula audit verify --signatures`.
#: needs = the two keys: arhugula audit keygen

[runtime.audit_signing]
backend = "local-ed25519"

[runtime.audit_signing.local_key_paths]
"harness-runtime-dev" = "{{KEYS}}/audit-ed25519.pem"
"harness-cost-attribution-v1" = "{{KEYS}}/audit-ed25519.pem"
