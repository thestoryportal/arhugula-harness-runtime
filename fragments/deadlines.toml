#: title = Longer deadlines
#: summary = Raises the per-step dispatch deadline from 30 to 120 seconds and the drain deadline from 60 to 120 seconds, for slow local models. Set other values with `arhugula config set step_dispatch_timeout_seconds <seconds>`.
#: needs = nothing

[runtime]
step_dispatch_timeout_seconds = 120.0
drain_timeout_seconds = 120.0
